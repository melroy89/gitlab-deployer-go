default:
  image: golang:1.27.1-trixie

  cache:
    key:
      files:
        - go.mod
    paths:
      - .go/pkg/mod/

variables:
  GOPATH: $CI_PROJECT_DIR/.go

stages:
  - test
  - build
  - publish

format:
  stage: test
  script:
    - test -z "$(gofmt -l -- *.go)"

test:
  stage: test
  script:
    - go test ./...

race:
  stage: test
  script:
    - go test -race ./...

vet:
  stage: test
  script:
    - go vet ./...

go-mod-tidy:
  stage: test
  script:
    - go mod tidy -diff

build:
  stage: build
  script:
    - go build ./...

# The available Docker executor runners cannot start rootless BuildKit or DinD.
# Kaniko builds and publishes without a Docker daemon or privileged container.
docker-release:
  stage: publish
  image:
    name: gcr.io/kaniko-project/executor:v1.23.2-debug
    entrypoint: [""]
  cache: []
  interruptible: false
  rules:
    - if: '$CI_PROJECT_PATH == "melroy/gitlab-artifact-deployer-go" && $CI_COMMIT_TAG =~ /^\d+\.\d+\.\d+$/'
    - if: '$CI_PROJECT_PATH == "melroy/gitlab-artifact-deployer-go" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: manual
      allow_failure: true
  script:
    - |
      set -eu
      image="${CI_REGISTRY_IMAGE}/artifact-deployer"
      mkdir -p /kaniko/.docker
      auth="$(printf '%s:%s' "$CI_REGISTRY_USER" "$CI_REGISTRY_PASSWORD" | base64 | tr -d '\n')"
      printf '{"auths":{"%s":{"auth":"%s"}}}\n' "$CI_REGISTRY" "$auth" > /kaniko/.docker/config.json
      if [ -n "${CI_COMMIT_TAG:-}" ]; then
        version="$CI_COMMIT_TAG"
        set -- --destination "${image}:${version}" --destination "${image}:latest"
      else
        version="ci-${CI_COMMIT_SHORT_SHA}"
        set -- --destination "${image}:${version}"
      fi
      /kaniko/executor \
        --context "$CI_PROJECT_DIR" \
        --dockerfile "$CI_PROJECT_DIR/Dockerfile" \
        --build-arg "VERSION=${version}" \
        --build-arg "VCS_REF=${CI_COMMIT_SHA}" \
        "$@"
