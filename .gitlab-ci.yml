default:
  image: golang:1.27.1-trixie

  cache:
    key:
      files:
        - go.mod
    paths:
      - .go/pkg/mod/

variables:
  GOPATH: $CI_PROJECT_DIR/.go

stages:
  - test
  - build
  - publish

format:
  stage: test
  script:
    - test -z "$(gofmt -l -- *.go)"

test:
  stage: test
  script:
    - go test ./...

race:
  stage: test
  script:
    - go test -race ./...

vet:
  stage: test
  script:
    - go vet ./...

go-mod-tidy:
  stage: test
  script:
    - go mod tidy -diff

build:
  stage: build
  script:
    - go build ./...

# Protected shell runners use the host Docker daemon. The candidate image
# supplies the Go toolchain used by the smoke test.
docker-smoke:
  stage: build
  tags: [shell]
  cache: []
  rules:
    - if: '$CI_PROJECT_PATH == "melroy/gitlab-artifact-deployer-go" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_REF_PROTECTED == "true"'
  script:
    - |
      set -eu
      candidate="artifact-deployer-ci:${CI_PROJECT_ID}-${CI_JOB_ID}"
      trap 'docker image rm "$candidate" >/dev/null 2>&1 || true' EXIT
      docker build --tag "$candidate" \
        --build-arg "VERSION=ci-${CI_COMMIT_SHORT_SHA}" \
        --build-arg "VCS_REF=${CI_COMMIT_SHA}" .
      ./scripts/docker-smoke.sh "$candidate"

docker-release:
  stage: publish
  tags: [shell]
  cache: []
  interruptible: false
  rules:
    - if: '$CI_PROJECT_PATH == "melroy/gitlab-artifact-deployer-go" && $CI_COMMIT_TAG =~ /^\d+\.\d+\.\d+$/ && $CI_COMMIT_REF_PROTECTED == "true"'
    - if: '$CI_PROJECT_PATH == "melroy/gitlab-artifact-deployer-go" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_REF_PROTECTED == "true"'
      when: manual
      allow_failure: true
  script:
    - |
      set -eu
      image="${CI_REGISTRY_IMAGE}/artifact-deployer"
      candidate="artifact-deployer-ci:${CI_PROJECT_ID}-${CI_JOB_ID}"
      docker_config=$(mktemp -d)
      cleanup() {
        docker image rm "$candidate" >/dev/null 2>&1 || true
        rm -r "$docker_config"
      }
      trap cleanup EXIT
      if [ -n "${CI_COMMIT_TAG:-}" ]; then
        version="$CI_COMMIT_TAG"
      else
        version="ci-${CI_COMMIT_SHORT_SHA}"
      fi
      docker build --tag "$candidate" \
        --build-arg "VERSION=${version}" \
        --build-arg "VCS_REF=${CI_COMMIT_SHA}" .
      ./scripts/docker-smoke.sh "$candidate"
      export DOCKER_CONFIG="$docker_config"
      printf '%s' "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" --username "$CI_REGISTRY_USER" --password-stdin
      docker tag "$candidate" "${image}:${version}"
      docker push "${image}:${version}"
      if [ -n "${CI_COMMIT_TAG:-}" ]; then
        docker tag "$candidate" "${image}:latest"
        docker push "${image}:latest"
      fi
